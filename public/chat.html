<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/app.css" />
    <title>Chat — DarkGPT</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" defer></script>
    <script type="module" src="/assets/chat.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark">🤖</span>DarkGPT</a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/chat" aria-current="page">Chat</a>
        <a href="/tools">Summarize &amp; Analyze</a>
      </nav>
    </header>
    <main class="chat-layout">
      <aside class="sidebar" id="sidebar">
        <button class="btn btn-primary" id="new-chat">✨ New chat</button>
        <h2>Chat history</h2>
        <ul class="history" id="history">
          <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
        </ul>
        <button class="btn btn-ghost" id="clear-history">Clear chat history ✖️</button>
      </aside>

      <section class="chat-main">
        <div class="chat-head">
          <button class="btn btn-ghost toggle-sidebar" id="toggle-sidebar" aria-label="Show chat history">☰</button>
          <h1 id="chat-title">New chat</h1>
          <label>Model <select id="model"></select></label>
        </div>

        <div class="messages" id="messages">
          <div class="messages-inner" id="messages-inner"></div>
        </div>

        <div class="composer">
          <form id="composer">
            <textarea id="input" rows="1" placeholder="Ask anything…" aria-label="Message" required></textarea>
            <button class="btn btn-primary" id="send" type="submit">Send</button>
          </form>
          <p class="hint">Enter to send · Shift+Enter for a new line</p>
        </div>
      </section>
    </main>
  </body>
</html>
